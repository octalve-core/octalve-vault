name: Bootstrap Production Admin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octalve-vault-production-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Create first production Super Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source safety
        run: pnpm verify:source

      - name: Verify production database schema
        run: pnpm exec prisma migrate status

      - name: Create first Super Admin
        run: pnpm admin:bootstrap
        env:
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_NAME: ${{ secrets.ADMIN_BOOTSTRAP_NAME }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
