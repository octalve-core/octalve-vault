name: Verify Vault Recovery

on:
  push:
    branches:
      - fix/vault-production-resilience

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://vault_ci:vault_ci@127.0.0.1:5432/vault_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.7.0 --activate
          pnpm --version

      - name: Run authoritative verification
        run: bash scripts/verify.sh
