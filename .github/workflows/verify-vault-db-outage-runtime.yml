name: Verify Vault DB-Outage Runtime

on:
  push:
    branches:
      - fix/vault-production-resilience

permissions:
  contents: read

jobs:
  outage-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://vault_unreachable:vault_unreachable@127.0.0.1:5432/vault_unreachable
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.7.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Start application with unavailable PostgreSQL
        run: |
          pnpm start -- -p 3000 > /tmp/vault-next.log 2>&1 &
          echo $! > /tmp/vault-next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vault-next.log
          exit 1

      - name: Verify liveness and readiness split
        run: |
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/health)" = "200"
          grep -q '"status":"ok"' /tmp/health.json

          test "$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:3000/api/ready)" = "503"
          grep -q '"status":"degraded"' /tmp/ready.json

      - name: Verify public fail-closed outage experience
        run: |
          for path in / /en /en/products /en/cart /en/checkout; do
            code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:3000$path")"
            test "$code" = "200"
            grep -q "temporarily unavailable" /tmp/page.html
          done

          code="$(curl -sS -o /tmp/admin.html -w '%{http_code}' http://127.0.0.1:3000/admin/login)"
          test "$code" = "200"
          grep -q "Welcome back" /tmp/admin.html

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/vault-next.log || true
