name: Update Next Security Pin

on:
  push:
    branches:
      - fix/vault-production-resilience

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.7.0 --activate

      - name: Update patched Next.js and lockfile
        run: pnpm up next@16.4.3 --save-exact --lockfile-only

      - name: Commit deterministic dependency update
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No dependency update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "security: update Next.js to 16.4.3"
          git push origin HEAD:fix/vault-production-resilience
