name: Production Database Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octalve-vault-production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply production Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source safety
        run: pnpm verify:source

      - name: Validate Prisma schema
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Apply pending production migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Verify production migration status
        run: pnpm exec prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
